name: Common packages

on:
  push:
    branches: [main]
    paths: ["common/**", "pnpm-lock.yaml"]
  pull_request:
    paths: ["common/**", "pnpm-lock.yaml"]

concurrency:
  group: common-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  common:
    name: Shared packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter "./common/*" lint
      - run: pnpm --filter "./common/*" typecheck
      - name: Translation catalogues stay in sync (en, fr, rw)
        run: pnpm --filter @genia/i18n test
      - run: pnpm --filter "./common/*" test
      - run: pnpm --filter "./common/*" build
  dependants:
    name: Dependants still pass
    needs: common
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm typecheck
