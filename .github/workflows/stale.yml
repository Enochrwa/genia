name: Stale

on:
  schedule:
    - cron: "0 4 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: security,money,pinned
          exempt-pr-labels: security,money,pinned
          stale-issue-message: This issue has had no activity for 45 days and will close in 14 days unless updated.
          stale-pr-message: This pull request has had no activity for 45 days and will close in 14 days unless updated.
