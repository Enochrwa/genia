name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "common/types/**", "pnpm-lock.yaml", ".dockerignore"]
  pull_request:
    paths: ["backend/**", "common/types/**", "pnpm-lock.yaml", ".dockerignore"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  money-critical:
    name: Money-critical tests (ledger, game, economics)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run with verbose reporter
        run: pnpm --filter @genia/api exec vitest run --reporter=verbose
      - name: Enforce coverage on domain code
        run: pnpm --filter @genia/api exec vitest run --coverage --coverage.thresholds.lines=90 --coverage.thresholds.functions=90 --coverage.thresholds.branches=85

  integration:
    name: Integration (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genia
          POSTGRES_PASSWORD: genia
          POSTGRES_DB: genia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U genia" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://genia:genia@localhost:5432/genia
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Verify services are reachable
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client redis-tools
          PGPASSWORD=genia psql -h localhost -U genia -d genia -c "select 1"
          redis-cli -h localhost ping
      - name: Apply migrations
        run: pnpm --filter @genia/api db:migrate
      - name: Integration tests
        run: pnpm --filter @genia/api exec vitest run --passWithNoTests --dir tests/integration --reporter=default --reporter=github-actions

  docker-image:
    name: Docker image builds and boots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start PostgreSQL and Redis
        run: |
          # Throw-away containers. PostgreSQL uses trust authentication, so no password exists anywhere.
          docker run -d --name pg --network host -e POSTGRES_USER=genia -e POSTGRES_DB=genia \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:16
          docker run -d --name redis --network host redis:7
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U genia >/dev/null 2>&1 && docker exec redis redis-cli ping >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs pg; exit 1
      - name: Build image
        run: docker build -f backend/api/Dockerfile -t genia-api:ci .
      - name: Boot the container and check readiness
        run: |
          # Secrets are generated for this run only. The image runs with NODE_ENV=production, which refuses
          # the console SMS provider and placeholder secrets, so this also exercises those safety checks.
          export DATABASE_URL="postgresql://genia@localhost:5432/genia"
          export REDIS_URL="redis://localhost:6379"
          export JWT_ACCESS_SECRET="$(openssl rand -hex 32)"
          export PIN_PEPPER="$(openssl rand -hex 16)"
          export OTP_PEPPER="$(openssl rand -hex 16)"
          export SMS_PROVIDER=africastalking
          export AFRICAS_TALKING_API_KEY="$(openssl rand -hex 8)"
          docker run -d --name api --network host \
            -e DATABASE_URL -e REDIS_URL -e JWT_ACCESS_SECRET -e PIN_PEPPER -e OTP_PEPPER \
            -e SMS_PROVIDER -e AFRICAS_TALKING_API_KEY -e API_PORT=4000 genia-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:4000/ready; then echo; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
      - name: Production config refuses unsafe settings
        run: |
          out=$(docker run --rm -e NODE_ENV=production -e DATABASE_URL=x -e JWT_ACCESS_SECRET=dev-only-0123456789012345678901234567890123 -e PIN_PEPPER=p -e OTP_PEPPER=o genia-api:ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "Invalid configuration"

  migrations-lint:
    name: Migration safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Block destructive statements without an explicit marker
        run: |
          set -e
          dir=backend/api/src/database/migrations
          [ -d "$dir" ] || exit 0
          if grep -rEin '(drop table|drop column|truncate)' "$dir" --include='*.sql' | grep -v 'allow-destructive'; then
            echo "Destructive migration found. Use expand/contract and add '-- allow-destructive: <reason>' only after review."
            exit 1
          fi
