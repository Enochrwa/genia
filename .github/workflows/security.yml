name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  audit:
    name: pnpm audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod --audit-level=high

  filesystem-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:0.57.1 \
            fs --severity HIGH,CRITICAL --ignore-unfixed --format sarif --output trivy.sarif --exit-code 1 .
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-fs

  api-contract-no-secrets-in-responses:
    name: "Guard - answers never appear in public question types"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public question shape must not contain correct-answer fields
        run: |
          node -e '
            const s=require("fs").readFileSync("backend/api/src/domain/game.ts","utf8");
            const m=s.match(/export interface PublicQuestion \{[\s\S]*?\}/);
            if(!m){console.error("PublicQuestion not found");process.exit(1)}
            if(/correct/i.test(m[0])){console.error("PublicQuestion must never expose the correct answer");process.exit(1)}
            console.log("ok: PublicQuestion has no correct-answer field");
          '
