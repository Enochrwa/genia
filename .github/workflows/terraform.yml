name: Terraform

on:
  pull_request:
    paths: ["infra/terraform/**"]
  push:
    branches: [main]
    paths: ["infra/terraform/**"]

permissions:
  contents: read

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate root module
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
  tfsec:
    name: Security scan (trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:0.57.1 \
            config --severity HIGH,CRITICAL --exit-code 1 infra
